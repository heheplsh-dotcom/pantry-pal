<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pantry Pal</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F5C4D">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#EDF3F1;--card:#FFFFFF;--ink:#10231F;--mute:#5F7570;--brand:#0F5C4D;--on:#FFFFFF;--hot:#C8352F;--warn:#A86F00;--ok:#2F7D5B;--line:#D5E1DD;--chip:#DDEBE7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1614;--card:#15251F;--ink:#E6F2EE;--mute:#8CA59E;--brand:#4FD1B0;--on:#06231C;--hot:#FF7A73;--warn:#E8B13B;--ok:#6FD0A0;--line:#243A33;--chip:#1D332C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0C1614;--card:#15251F;--ink:#E6F2EE;--mute:#8CA59E;--brand:#4FD1B0;--on:#06231C;--hot:#FF7A73;--warn:#E8B13B;--ok:#6FD0A0;--line:#243A33;--chip:#1D332C;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;padding-bottom:84px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
main{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em}
h2{font-size:20px;font-weight:800;margin:22px 0 10px}
.sub{color:var(--mute);margin:2px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.name{font-weight:600;text-transform:capitalize}
.meta{color:var(--mute);font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--chip);font-weight:600}
button.primary{background:var(--brand);color:var(--on)}
button.ghost{background:none;color:var(--mute);padding:6px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.badge{font-size:13px;font-weight:600;border-radius:99px;padding:3px 10px;background:var(--chip);white-space:nowrap}
.badge.hot{background:var(--hot);color:#fff}
.badge.warn{background:var(--warn);color:#fff}
@media (prefers-color-scheme:dark){.badge.hot,.badge.warn{color:#10231F}}
.bar{height:8px;border-radius:9px;background:var(--chip);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--brand);border-radius:9px;transition:width .3s}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tag{font-size:13px;padding:2px 9px;border-radius:99px;background:var(--chip)}
.tag.miss{background:none;border:1px dashed var(--mute);color:var(--mute)}
.tag.soon{background:var(--hot);color:#fff}
@media (prefers-color-scheme:dark){.tag.soon{color:#10231F}}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-size:34px;font-weight:800;letter-spacing:-.02em}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;max-width:130px;background:none;color:var(--mute);border-radius:10px;padding:8px 4px;font-size:14px}
nav button[aria-current="page"]{color:var(--brand);background:var(--chip)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;max-width:90%}
.steps{margin:8px 0 0;color:var(--mute);font-size:14px}
.chk{width:22px;height:22px;accent-color:var(--brand)}
.done .name{text-decoration:line-through;color:var(--mute)}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var ITEM_VALUE=2.5;
var STAPLES=["salt","pepper","oil","water"];
var RECIPES=[
{n:"Veggie fried rice",t:"20 min",i:["rice","egg","carrot","onion","soy sauce"],s:"Fry onion and carrot, add cold rice, scramble the egg in a gap, finish with soy sauce."},
{n:"Tomato egg scramble",t:"10 min",i:["egg","tomato","onion","bread"],s:"Soften onion and tomato, pour in beaten egg, serve on toast."},
{n:"Garlicky tomato pasta",t:"20 min",i:["pasta","tomato","garlic","cheese"],s:"Simmer tomato with garlic, toss with pasta, top with cheese."},
{n:"Spinach cheese omelette",t:"10 min",i:["egg","spinach","cheese"],s:"Wilt spinach, add eggs, fold in cheese."},
{n:"Chicken stir-fry",t:"25 min",i:["chicken","bell pepper","onion","soy sauce","rice"],s:"Sear chicken, add vegetables and soy sauce, serve over rice."},
{n:"Loaded baked potatoes",t:"45 min",i:["potato","cheese","butter","onion"],s:"Bake potatoes, split, fill with butter, cheese and sautéed onion."},
{n:"Chicken quesadillas",t:"15 min",i:["tortilla","cheese","bell pepper","chicken"],s:"Fill tortillas, toast in a dry pan until crisp."},
{n:"Banana pancakes",t:"15 min",i:["banana","egg","milk","flour"],s:"Mash banana, whisk with egg, milk and flour, fry in small rounds."},
{n:"Garlic mushroom toast",t:"10 min",i:["mushroom","garlic","butter","bread"],s:"Fry mushrooms and garlic in butter, pile onto toast."},
{n:"Chickpea tomato curry",t:"30 min",i:["chickpeas","tomato","onion","garlic","rice"],s:"Cook onion and garlic, add tomato and chickpeas, simmer, serve with rice."},
{n:"Cheesy broccoli pasta",t:"20 min",i:["pasta","broccoli","cheese","garlic"],s:"Boil broccoli with the pasta, toss with garlic and cheese."},
{n:"Caprese toast",t:"5 min",i:["tomato","cheese","basil","bread"],s:"Toast bread, layer tomato, cheese and basil."}
];
var DEMO=[["spinach",1],["milk",2],["chicken",2],["tomato",3],["egg",9],["cheese",14],["bread",4],["onion",20],["garlic",30],["rice",90],["pasta",90],["bell pepper",5]];
var st={items:[],list:[],saved:0,wasted:0,rescued:0,tossed:0};
var tab="pantry",AI=null,scan=null,ideas=null;
try{var raw=localStorage.getItem("pp1");if(raw)st=Object.assign(st,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem("pp1",JSON.stringify(st))}catch(e){}}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function today(){var d=new Date();d.setHours(0,0,0,0);return d.getTime()}
function daysLeft(it){return Math.round((it.exp-today())/864e5)}
function addItem(name,days){name=name.trim().toLowerCase();if(!name)return;st.items.push({id:Date.now()+Math.random(),name:name,exp:today()+days*864e5})}
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}
function match(ing,item){return item.name===ing||item.name.indexOf(ing)>-1||ing.indexOf(item.name)>-1}
function find(ing){return st.items.filter(function(it){return match(ing,it)})[0]}
function scored(){
  return RECIPES.map(function(r){
    var have=[],miss=[],soon=0;
    r.i.forEach(function(g){var it=find(g);if(it){have.push(g);if(daysLeft(it)<=3)soon++}else miss.push(g)});
    return {r:r,have:have,miss:miss,soon:soon,score:have.length/r.i.length*100+soon*14};
  }).filter(function(x){return x.have.length>0}).sort(function(a,b){return b.score-a.score});
}
function badge(d){
  if(d<0)return '<span class="badge hot">Expired</span>';
  if(d===0)return '<span class="badge hot">Today</span>';
  if(d<=3)return '<span class="badge hot">'+d+'d left</span>';
  if(d<=7)return '<span class="badge warn">'+d+'d left</span>';
  return '<span class="badge">'+d+'d</span>';
}
function money(n){return "$"+n.toFixed(2)}
function viewPantry(){
  var items=st.items.slice().sort(function(a,b){return a.exp-b.exp});
  var soon=items.filter(function(i){return daysLeft(i)<=3});
  var h='<h1>Your pantry</h1><p class="sub">'+(items.length?items.length+' items'+(soon.length?', '+soon.length+' to use soon':''):'Add what you have and get dinner ideas.')+'</p>';
  h+=scanCard();
  h+='<div class="card"><div class="row"><input class="grow" id="nm" list="sug" placeholder="Add an item (e.g. spinach)" aria-label="Item name"><select id="dy" aria-label="Lasts about"><option value="2">2 days</option><option value="4">4 days</option><option value="7" selected>1 week</option><option value="14">2 weeks</option><option value="30">1 month</option><option value="180">Long life</option></select></div><div class="row" style="margin-top:10px"><button class="primary grow" id="add">Add item</button><button id="demo">Load sample fridge</button></div></div>';
  h+='<datalist id="sug">'+Object.keys(RECIPES.reduce(function(o,r){r.i.forEach(function(x){o[x]=1});return o},{})).map(function(x){return '<option value="'+x+'">'}).join("")+'</datalist>';
  if(!items.length)h+='<div class="empty">Nothing here yet. Add an item or load the sample fridge to see recipe matches.</div>';
  items.forEach(function(it){
    h+='<div class="card row"><div class="grow"><div class="name">'+esc(it.name)+'</div></div>'+badge(daysLeft(it))+'<button data-use="'+it.id+'" title="Mark as used">Used</button><button class="ghost" data-toss="'+it.id+'" title="Mark as thrown away" aria-label="Thrown away">Toss</button></div>';
  });
  return h;
}
function viewCook(){
  var rs=scored();
  var h='<h1>Cook tonight</h1><p class="sub">Ranked by what you have and what’s about to go off.</p>';
  h+=ideasCard();
  if(!rs.length)h+='<div class="empty">No matches yet. Add a few items in Pantry first.</div>';
  rs.forEach(function(x,idx){
    var pct=Math.round(x.have.length/x.r.i.length*100);
    h+='<div class="card"><div class="row"><div class="grow name">'+esc(x.r.n)+'</div><span class="meta">'+x.r.t+'</span></div>';
    h+='<div class="bar" role="img" aria-label="'+pct+'% of ingredients on hand"><i style="width:'+pct+'%"></i></div>';
    h+='<div class="meta">'+x.have.length+' of '+x.r.i.length+' on hand'+(x.soon?' · uses '+x.soon+' expiring':'')+'</div><div class="tags">';
    x.have.forEach(function(g){var d=daysLeft(find(g));h+='<span class="tag'+(d<=3?' soon':'')+'">'+esc(g)+'</span>'});
    x.miss.forEach(function(g){h+='<span class="tag miss">'+esc(g)+'</span>'});
    h+='</div><div class="steps">'+esc(x.r.s)+'</div><div class="row" style="margin-top:10px">';
    h+='<button class="primary" data-cook="'+RECIPES.indexOf(x.r)+'">I cooked this</button>';
    if(x.miss.length)h+='<button data-need="'+RECIPES.indexOf(x.r)+'">Add '+x.miss.length+' missing to list</button>';
    h+='</div></div>';
  });
  return h;
}
function viewShop(){
  var h='<h1>Shopping list</h1><p class="sub">Built from recipes you want to make.</p>';
  h+='<div class="card row"><input class="grow" id="sn" placeholder="Add to list" aria-label="List item"><button class="primary" id="sadd">Add</button></div>';
  if(!st.list.length)h+='<div class="empty">Your list is empty. Tap “Add missing to list” on a recipe.</div>';
  st.list.forEach(function(x,i){
    h+='<div class="card row'+(x.done?' done':'')+'"><input type="checkbox" class="chk" data-chk="'+i+'"'+(x.done?' checked':'')+' aria-label="Got '+esc(x.name)+'"><div class="grow name">'+esc(x.name)+'</div><button class="ghost" data-del="'+i+'" aria-label="Remove">Remove</button></div>';
  });
  if(st.list.some(function(x){return x.done}))h+='<button class="primary" id="stock" style="width:100%;margin-top:6px">Move checked items to pantry</button>';
  return h;
}
function viewSaved(){
  var tot=st.rescued+st.tossed,rate=tot?Math.round(st.rescued/tot*100):0;
  var h='<h1>Your impact</h1><p class="sub">Food you used instead of binning.</p><div class="stats">';
  h+='<div class="card stat"><b>'+money(st.saved)+'</b><span class="meta">saved</span></div>';
  h+='<div class="card stat"><b>'+money(st.wasted)+'</b><span class="meta">wasted</span></div>';
  h+='<div class="card stat"><b>'+st.rescued+'</b><span class="meta">items used</span></div>';
  h+='<div class="card stat"><b>'+rate+'%</b><span class="meta">use rate</span></div></div>';
  h+='<div class="card"><div class="bar"><i style="width:'+rate+'%"></i></div><div class="meta">Each item is valued at about '+money(ITEM_VALUE)+'. Mark items Used or Toss in Pantry to keep this honest.</div></div>';
  h+='<button id="reset" style="width:100%">Reset everything</button>';
  return h;
}
var PH='<input type="file" id="ph" accept="image/*" hidden>';
var KNOWN=Object.keys(RECIPES.reduce(function(o,r){r.i.forEach(function(x){o[x]=1});return o},{}));
function errmsg(e){var m={not_granted:"Claude access was declined, so this is off. You can still add items by hand.",rate_limited:"Too many requests. Wait a minute and try again.",images_unavailable:"Photo scanning isn’t available here."};return m[e&&e.code]||"That didn’t work. Try a brighter, closer photo."}
function shrink(f){return new Promise(function(res,rej){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?res(b):rej(new Error("x"))},"image/jpeg",.8)};im.onerror=function(){rej(new Error("x"))};im.src=u})}
function scanPhoto(f){
  scan={busy:true};render();
  shrink(f).then(function(b){
    return AI.json("This is a photo of a fridge, pantry or groceries. List each distinct edible food item you can clearly see. Return ONLY a JSON array of objects {\"name\":string,\"days\":integer}. Use a simple lowercase singular name, and when an item fits one of these exact names use it: "+KNOWN.join(", ")+". days = realistic days of freshness left (1 to 180); assume fresh unless it looks old. Maximum 25 items. If you see no food, return [].",{images:[b],cache:false});
  }).then(function(a){
    scan={found:(Array.isArray(a)?a:[]).filter(function(x){return x&&x.name}).map(function(x){return{name:String(x.name).toLowerCase().slice(0,40),days:Math.max(1,Math.min(180,parseInt(x.days)||7)),on:true}})};render();
  }).catch(function(e){scan={err:errmsg(e)};render()});
}
function scanCard(){
  if(!AI)return "";
  if(scan&&scan.busy)return '<div class="card"><div class="name">Reading your photo…</div><div class="meta">Claude is spotting ingredients. This takes a few seconds.</div></div>';
  if(scan&&scan.err)return '<div class="card"><div class="name">Couldn’t scan</div><div class="meta">'+esc(scan.err)+'</div><button class="primary" id="scan" style="margin-top:10px">Try another photo</button>'+PH+'</div>';
  if(scan&&scan.found){
    if(!scan.found.length)return '<div class="card"><div class="name">No food spotted</div><div class="meta">Get closer and make sure the shelves are lit.</div><button class="primary" id="scan" style="margin-top:10px">Try another photo</button>'+PH+'</div>';
    var h='<div class="card"><div class="name">Found '+scan.found.length+' items</div><div class="meta">Untick anything that’s wrong.</div>';
    scan.found.forEach(function(x,i){h+='<label class="row" style="margin:8px 0"><input type="checkbox" class="chk" data-sc="'+i+'" checked><span class="grow name">'+esc(x.name)+'</span><span class="meta">about '+x.days+'d</span></label>'});
    return h+'<div class="row"><button class="primary grow" id="scadd">Add to pantry and see recipes</button><button id="scno">Discard</button></div></div>';
  }
  return '<div class="card"><div class="name">Scan your fridge</div><div class="meta">Take a photo and Claude lists what it sees, then suggests dinner.</div><button class="primary" id="scan" style="margin-top:10px;width:100%">Take or choose a photo</button>'+PH+'</div>';
}
function ideasCard(){
  if(!AI||!st.items.length)return "";
  if(ideas&&(ideas.text||ideas.busy))return '<div class="card"><div class="name">Claude’s dinner ideas</div><div id="ideas" style="white-space:pre-wrap;margin-top:8px">'+esc(ideas.text||"Thinking…")+'</div>'+(ideas.busy?'':'<button id="idea" style="margin-top:10px">Get new ideas</button>')+'</div>';
  if(ideas&&ideas.err)return '<div class="card"><div class="meta">'+esc(ideas.err)+'</div><button id="idea" style="margin-top:8px">Try again</button></div>';
  return '<div class="card"><div class="name">Want something more creative?</div><div class="meta">Claude can invent dinners from your exact ingredients.</div><button class="primary" id="idea" style="margin-top:10px">Ask Claude for ideas</button></div>';
}
function askIdeas(){
  var list=st.items.slice().sort(function(a,b){return a.exp-b.exp}).map(function(i){return i.name+" ("+daysLeft(i)+" days left)"}).join(", ");
  ideas={busy:true};
  AI("I have these ingredients: "+list+". Assume salt, pepper, oil and water are available. Suggest 3 dinners I can make, using the items closest to expiring first. For each give a name, which of my ingredients it uses, and 3 short steps. Plain text only, no markdown symbols, no intro or outro.",{cache:false,onText:function(o){ideas={busy:true,text:o.text};var el=document.getElementById("ideas");if(el)el.textContent=o.text}})
  .then(function(r){ideas={text:r.text};render()}).catch(function(e){ideas={err:errmsg(e),text:e&&e.text};render()});
}
function render(){
  var v={pantry:viewPantry,cook:viewCook,shop:viewShop,saved:viewSaved}[tab]();
  document.getElementById("app").innerHTML=v;
  var labels=[["pantry","Pantry"],["cook","Cook"],["shop","Shop"],["saved","Impact"]];
  var need=st.list.filter(function(x){return!x.done}).length;
  document.getElementById("nav").innerHTML=labels.map(function(l){return '<button data-tab="'+l[0]+'"'+(tab===l[0]?' aria-current="page"':'')+'>'+l[1]+(l[0]==="shop"&&need?' ('+need+')':'')+'</button>'}).join("");
  save();
}
function use(id,kind){
  var it=st.items.filter(function(x){return String(x.id)===id})[0];if(!it)return;
  st.items=st.items.filter(function(x){return x!==it});
  if(kind==="use"){st.saved+=ITEM_VALUE;st.rescued++;toast("Nice, one less thing wasted")}
  else{st.wasted+=ITEM_VALUE;st.tossed++;toast("Tossed. Next time we’ll nudge you sooner")}
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;var d=b.dataset;
  if(d.tab){tab=d.tab;window.scrollTo(0,0);render();return}
  if(d.use){use(d.use,"use")}
  else if(d.toss){use(d.toss,"toss")}
  else if(d.cook!==undefined){
    var r=RECIPES[+d.cook],n=0;
    r.i.forEach(function(g){var it=find(g);if(it){st.items=st.items.filter(function(x){return x!==it});n++}});
    st.saved+=n*ITEM_VALUE;st.rescued+=n;toast("Cooked! "+n+" items used")}
  else if(d.need!==undefined){
    var r2=RECIPES[+d.need],c=0;
    r2.i.forEach(function(g){if(!find(g)&&!st.list.some(function(x){return x.name===g})){st.list.push({name:g,done:false});c++}});
    toast(c+" added to your list")}
  else if(d.del!==undefined){st.list.splice(+d.del,1)}
  else if(b.id==="add"){var nm=document.getElementById("nm");if(!nm.value.trim()){nm.focus();return}addItem(nm.value,+document.getElementById("dy").value)}
  else if(b.id==="demo"){DEMO.forEach(function(x){if(!st.items.some(function(i){return i.name===x[0]}))addItem(x[0],x[1])});toast("Sample fridge loaded")}
  else if(b.id==="sadd"){var sn=document.getElementById("sn");if(sn.value.trim())st.list.push({name:sn.value.trim().toLowerCase(),done:false})}
  else if(b.id==="stock"){st.list.filter(function(x){return x.done}).forEach(function(x){addItem(x.name,7)});st.list=st.list.filter(function(x){return!x.done});toast("Added to pantry")}
  else if(b.id==="reset"){if(confirm("Clear all pantry data and stats?")){st={items:[],list:[],saved:0,wasted:0,rescued:0,tossed:0}}else return}
  else if(b.id==="scan"){document.getElementById("ph").click();return}
  else if(b.id==="scno"){scan=null}
  else if(b.id==="scadd"){var n3=0;scan.found.forEach(function(x){if(x.on&&!st.items.some(function(i){return i.name===x.name})){addItem(x.name,x.days);n3++}});scan=null;tab="cook";window.scrollTo(0,0);toast(n3+" items added. Here’s what you can cook")}
  else if(b.id==="idea"){askIdeas()}
  else return;
  render();
});
document.addEventListener("change",function(e){
  if(e.target.id==="ph"&&e.target.files[0])scanPhoto(e.target.files[0]);
  if(e.target.dataset.sc!==undefined)scan.found[+e.target.dataset.sc].on=e.target.checked;
});
document.addEventListener("change",function(e){if(e.target.dataset.chk!==undefined){st.list[+e.target.dataset.chk].done=e.target.checked;render()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"){if(e.target.id==="nm")document.getElementById("add").click();if(e.target.id==="sn")document.getElementById("sadd").click()}});
render();
if(window.claude&&claude.use){claude.use("sample").then(function(x){if(x){AI=x;render()}}).catch(function(){})}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
</body>
</html>
